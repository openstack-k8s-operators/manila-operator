---
# project template to be used locally for operator testing
- project-template:
    name: manila-operator-s2i-testing
    github-check:
      jobs:
        - manila-s2i-content-provider
        - manila-s2i-test-cephfs:
            dependencies:
              - openstack-k8s-operators-content-provider
              - manila-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: manila-operator-s2i-component-jobs
    github-check:
      jobs:
        - manila-s2i-test-cephfs:
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/manila/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

- project:
    name: openstack-k8s-operators/manila-operator
    templates:
      - manila-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - manila-operator-kuttl:
            dependencies:
              - openstack-k8s-operators-content-provider
        - manila-operator-antelope-tempest:
            dependencies:
              - openstack-k8s-operators-content-provider

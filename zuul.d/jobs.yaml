---
- job:
    name: manila-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/manila-operator
    irrelevant-files: &ir_files
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - ^renovate.json$
    vars:
      cifmw_kuttl_tests_env_vars:
        CEPH_HOSTNETWORK: true
        CEPH_TIMEOUT: 90
        CEPH_DATASIZE: "2Gi"
        PV_NUM: 20
      cifmw_kuttl_tests_operator_list:
        - manila

- job:
    name: manila-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i manila service images for manila-s2i tempest jobs.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - manila/manila-api
        - manila/manila-scheduler
        - manila/manila-share

- job:
    name: manila-s2i-test-cephfs
    parent: s2i-test-base-ceph
    description: |
      Validate speculatively-built s2i manila images against a live
      HCI OpenStack deployment with Ceph.
    irrelevant-files: *ir_files
    vars:
      s2i_manila_share_backends: ['share1']
      cifmw_block_device_size: 15G
      cifmw_services_manila_enabled: True
      # workaround: force ceph to run on the public network
      cifmw_ceph_spec_public_network: "{{ cifmw_ceph_ssh_network_range | default('192.168.122.0/24') }}"
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^manila_tempest_tests.tests..*
      # The service image used here does not ship ceph fuse client,
      # and only supports kernel access, so exclude ceph fuse tests
      cifmw_test_operator_tempest_exclude_list: |
        ^manila_tempest_tests.tests.scenario.*ceph_fuse.*
      # Reenable when https://review.opendev.org/c/openstack/manila-tempest-plugin/+/1011484 lands (followup fix for CVE-2026-71195)
      cifmw_test_operator_tempest_expected_failures_list: |
         manila_tempest_tests.tests.api.admin.test_export_locations_negative.ExportLocationsNegativeTest.test_list_share_export_locations_by_different_project_user
         manila_tempest_tests.tests.api.admin.test_export_locations_negative.ExportLocationsNegativeTest.test_get_share_export_location_by_different_project_user
         manila_tempest_tests.tests.rbac.test_export_locations.TestProjectMemberTestsCEPHFS.test_list_export_locations
         manila_tempest_tests.tests.rbac.test_export_locations.TestProjectMemberTestsCEPHFS.test_show_export_location
         manila_tempest_tests.tests.rbac.test_export_locations.TestProjectReaderTestsCEPHFS.test_list_export_locations
         manila_tempest_tests.tests.rbac.test_export_locations.TestProjectReaderTestsCEPHFS.test_show_export_location
      cifmw_test_operator_tempest_extra_images:
        - name: manila-service-image-master
          URL: https://tarballs.opendev.org/openstack/manila-test-image/images/manila-test-image-client.qcow2
          diskFormat: qcow2
          flavor:
            name: customized_flavor
            ID: "100"
            RAM: 128
            disk: 1
            vcpus: 1
      cifmw_test_operator_tempest_network_attachments:
        - ctlplane
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          share.capability_storage_protocol CEPHFS
          share.catalog_type 'sharev2'
          share.default_share_type_name 'default'
          share.enable_cert_rules_for_protocols ""
          share.enable_ip_rules_for_protocols ""
          share.run_share_group_tests False
          share.suppress_errors_in_cleanup True

- job:
    name: manila-s2i-test-nfsganesha
    parent: s2i-test-base-ceph
    description: |
      Validate speculatively-built s2i manila images with NFS ganesha backend
      against a live HCI OpenStack deployment with Ceph.
    irrelevant-files: *ir_files
    vars:
      s2i_manila_share_backends: ['share1']
      cifmw_block_device_size: 15G
      cifmw_cephadm_nfsv3: true
      cifmw_ceph_daemons_layout:
        rgw_enabled: false
        dashboard_enabled: false
        cephfs_enabled: false
        ceph_nfs_enabled: true
      # workaround: force ceph to run on the public network
      cifmw_ceph_spec_public_network: "{{ cifmw_ceph_ssh_network_range | default('192.168.122.0/24') }}"
      cifmw_services_manila_enabled: True
      cifmw_test_operator_tempest_workflow:
        - stepName: multi-thread
          tempestRun:
            concurrency: 3
            includeList: |
              ^manila_tempest_tests.tests.api..*
              ^manila_tempest_tests.tests.rbac..*
            # Reenable when https://review.opendev.org/c/openstack/manila-tempest-plugin/+/1011484 lands (followup fix for CVE-2026-71195)
            expectedFailuresList: |
              manila_tempest_tests.tests.api.admin.test_export_locations_negative.ExportLocationsNegativeTest.test_list_share_export_locations_by_different_project_user
              manila_tempest_tests.tests.api.admin.test_export_locations_negative.ExportLocationsNegativeTest.test_get_share_export_location_by_different_project_user
              manila_tempest_tests.tests.rbac.test_export_locations.TestProjectMemberTestsNFS.test_list_export_locations
              manila_tempest_tests.tests.rbac.test_export_locations.TestProjectMemberTestsNFS.test_show_export_location
              manila_tempest_tests.tests.rbac.test_export_locations.TestProjectReaderTestsNFS.test_list_export_locations
              manila_tempest_tests.tests.rbac.test_export_locations.TestProjectReaderTestsNFS.test_show_export_location
        - stepName: single-thread
          tempestRun:
            concurrency: 1
            includeList: |
              ^manila_tempest_tests.tests.scenario..*
            # The service image used here does not ship ceph fuse client,
            # and only supports kernel access, so exclude ceph fuse tests
            excludeList: |
              ^manila_tempest_tests.tests.scenario.*ceph_fuse.*
            extraImages:
              - name: manila-service-image-master
                URL: https://tarballs.opendev.org/openstack/manila-test-image/images/manila-test-image-client.qcow2
                diskFormat: qcow2
                flavor:
                  name: customized_flavor
                  ID: "100"
                  RAM: 128
                  disk: 1
                  vcpus: 1
      cifmw_test_operator_tempest_network_attachments:
        - ctlplane
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          share.capability_storage_protocol NFS
          share.catalog_type 'sharev2'
          share.default_share_type_name 'default'
          share.enable_cert_rules_for_protocols ""
          share.enable_ip_rules_for_protocols 'nfs'
          share.enable_protocols 'nfs'
          share.override_ip_for_nfs_access 192.168.122.0/24
          share.nfs_versions '3,4.1,4.2'
          share.run_share_group_tests False
      cifmw_test_operator_timeout: 5400
